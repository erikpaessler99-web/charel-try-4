<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0",
          "three/": "https://esm.sh/three@0.160.0/",
          "tone": "https://esm.sh/tone@14.7.77"
        }
      }
    </script>
    <style>
      html, body { margin: 0; padding: 0; background-color: #0a0014; overflow: hidden; }
      canvas { display: block; cursor: pointer; }
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #fff;
        font-family: 'Orbitron', sans-serif;
        text-shadow: 0 0 10px rgba(255,255,255,0.8);
        z-index: 100;
      }
      #artifacts-count {
        font-size: 24px;
        font-weight: 700;
        background: rgba(0,0,0,0.6);
        padding: 15px 20px;
        border-radius: 10px;
        border: 2px solid #ff00ff;
        box-shadow: 0 0 20px rgba(255,0,255,0.5);
      }
      #progress-message {
        margin-top: 10px;
        font-size: 18px;
        background: rgba(0,100,0,0.8);
        padding: 10px 15px;
        border-radius: 8px;
        animation: pulse 1s infinite;
        display: none;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      #instructions {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-family: 'Orbitron', sans-serif;
        background: rgba(0,0,0,0.7);
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <script type="module" src="main.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ChatManager.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ImageGenerator.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ProgressLogger.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/OGP.js"></script>
  </body>
</html>
