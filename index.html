<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0",
          "three/": "https://esm.sh/three@0.160.0/",
          "tone": "https://esm.sh/tone@14.7.77"
        }
      }
    </script>
    <style>
      html, body { margin: 0; padding: 0; background-color: #0a0014; overflow: hidden; }
      canvas { display: block; cursor: pointer; }
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #fff;
        font-family: 'Orbitron', sans-serif;
        text-shadow: 0 0 10px rgba(255,255,255,0.8);
        z-index: 100;
      }
      #artifacts-count {
        font-size: 24px;
        font-weight: 700;
        background: rgba(0,0,0,0.6);
        padding: 15px 20px;
        border-radius: 10px;
        border: 2px solid #ff00ff;
        box-shadow: 0 0 20px rgba(255,0,255,0.5);
      }
      #collection-message {
        margin-top: 10px;
        font-size: 20px;
        background: rgba(255,100,0,0.8);
        padding: 12px 18px;
        border-radius: 8px;
        animation: pulse 1s infinite;
        transition: opacity 0.5s;
      }
      #progress-message {
        margin-top: 10px;
        font-size: 18px;
        background: rgba(0,100,0,0.8);
        padding: 10px 15px;
        border-radius: 8px;
        animation: pulse 1s infinite;
        display: none;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      #instructions {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-family: 'Orbitron', sans-serif;
        background: rgba(0,0,0,0.7);
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 16px;
        text-align: center;
      }
      #password-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
        padding: 40px;
        border-radius: 15px;
        border: 3px solid #ff00ff;
        box-shadow: 0 0 40px rgba(255,0,255,0.6);
        text-align: center;
        font-family: 'Orbitron', sans-serif;
      }
      .modal-content h2 {
        color: #fff;
        margin-top: 0;
        font-size: 28px;
        text-shadow: 0 0 10px rgba(255,0,255,0.8);
      }
      #password-input {
        width: 250px;
        padding: 15px;
        font-size: 24px;
        font-family: 'Orbitron', sans-serif;
        background: rgba(0,0,0,0.6);
        border: 2px solid #00ffff;
        border-radius: 8px;
        color: #fff;
        text-align: center;
        text-transform: uppercase;
        margin: 20px 0;
      }
      #password-input:focus {
        outline: none;
        border-color: #ff00ff;
        box-shadow: 0 0 15px rgba(255,0,255,0.6);
      }
      #password-error {
        color: #ff0000;
        font-size: 16px;
        min-height: 20px;
        margin: 10px 0;
        text-shadow: 0 0 10px rgba(255,0,0,0.8);
      }
      .modal-content button {
        padding: 12px 30px;
        margin: 10px;
        font-size: 16px;
        font-family: 'Orbitron', sans-serif;
        background: rgba(0,0,0,0.6);
        border: 2px solid #00ff00;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s;
      }
      .modal-content button:hover {
        background: rgba(0,255,0,0.2);
        box-shadow: 0 0 15px rgba(0,255,0,0.6);
      }
      #password-cancel {
        border-color: #ff0000;
      }
      #password-cancel:hover {
        background: rgba(255,0,0,0.2);
        box-shadow: 0 0 15px rgba(255,0,0,0.6);
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
    </style>
  </head>
  <body>
    <!-- Background techno music -->
    <audio id="bg-music" autoplay loop>
      <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_4a26e86de7.mp3" type="audio/mpeg">
    </audio>
    
    <script type="module" src="main.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ChatManager.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ImageGenerator.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ProgressLogger.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/OGP.js"></script>
  </body>
</html>
